project_name:
  type: str
  help: Project name
  default: "{{ _copier_conf.dst_path | basename if _copier_conf.dst_path != '.' else 'my-project' }}"

package_name:
  type: str
  help: Python package name
  default: "{{ project_name | lower | replace('-', '_') }}"
  
author_name:
  type: str
  help: Author name
  default: Darren Kidney

python_version:
  type: str
  help: Python version
  default: "3.12"

_tasks:
  - "uv python install {{ python_version }}"
  - "uv venv .venv --prompt .venv --python {{ python_version }}"
  - "uv sync"
